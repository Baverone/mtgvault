name: Recolha diária

on:
  schedule:
    # 06:00 UTC. O cron do GitHub é best-effort: em horas de pico atrasa,
    # e ocasionalmente salta execuções. Por isso o harvest recolhe 3 dias
    # para trás e o preço só grava mudanças — um dia perdido recupera-se.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtgvault-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTGVAULT_DB: ${{ github.workspace }}/data/vault.db
      MTGVAULT_CATALOG: ${{ github.workspace }}/data/catalog.db
      CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
      CARDTRADER_SETS: ${{ vars.CARDTRADER_SETS }}
      MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
      CARDMARKET_COOKIE: ${{ secrets.CARDMARKET_COOKIE }}
      CARDMARKET_PRICEGUIDE_URL: ${{ secrets.CARDMARKET_PRICEGUIDE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trabalho diário
        run: python daily.py

      - name: Guardar alterações
        run: |
          git config user.name  "mtgvault bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/vault.db coredecks.html colecao.html cobertura.html alertas.html colecao_cor.html buildability.html meusdecks.html metagame.html prioridade.html metafaltas.html reservedlist.html colvalor.html
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "dados $(date -u +%F)"
            git push
          fi

      - name: Resumo
        if: always()
        run: python -m mtgvault.cli status >> "$GITHUB_STEP_SUMMARY"
