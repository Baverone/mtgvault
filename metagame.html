const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const eur=x=>(x||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const FMTS=[["standard","Standard"],["modern","Modern"],["legacy","Legacy"],["pioneer","Pioneer"]];
let cur="modern";
const tabs=document.getElementById("tabs"), app=document.getElementById("app");
function rows(a){return a.map(c=>'<div class="row"><span>'+c[1]+'x '+esc(c[0])+'</span><span class="price">'+eur(c[1]*c[2])+'</span></div>').join("");}
function render(){
 tabs.innerHTML=FMTS.map(f=>'<button class="tab '+(f[0]===cur?"on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>').join("");
 tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.f;render();});
 const decks=DATA[cur]||[];
 app.innerHTML=decks.map((d,i)=>'<div class="card"><div class="top"><span class="rank">#'+(i+1)+'</span><span class="name">'+esc(d.name)+
   '</span><span class="when">'+d.n+' listas &middot; <b>'+eur(d.cost)+'</b></span></div>'+
   '<details><summary>ver lista ('+d.total+')</summary><div class="list">'+
   '<div class="b">Main ('+d.mainN+')</div>'+rows(d.main)+
   (d.sb.length?'<div class="b">Sideboard ('+d.sbN+')</div>'+rows(d.sb):"")+
   '</div></details></div>').join("");
}
render();
