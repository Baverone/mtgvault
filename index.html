<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coleção do Prime</title>
<style>
 :root{--bg:#0d1017;--card:#161b24;--ink:#eef2f7;--muted:#8b97a6;--line:#242c38;--accent:#5b8cff;--gold:#e0b64b}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1b2740,#0d1017);
      color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;padding:24px}
 .hub{width:100%;max-width:760px;text-align:center}
 .avatar{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;overflow:hidden;
         border:3px solid var(--accent);box-shadow:0 8px 40px #0008;background:#11161f;
         display:flex;align-items:center;justify-content:center}
 .avatar img{width:100%;height:100%;object-fit:cover;display:block}
 .avatar .ph{font-size:56px;opacity:.85}
 h1{margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:-.02em}
 .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
 .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
 .tabs a{padding:20px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);
         color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;transition:.15s}
 .tabs a:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px #0006}
 .tabs a .ic{display:block;font-size:26px;margin-bottom:6px}
 .subnav{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
 .subnav a{font-size:13px;padding:8px 14px;border-radius:20px;background:#141a24;border:1px solid var(--line);
           color:var(--muted);text-decoration:none} .subnav a:hover{color:var(--ink);border-color:var(--accent)}
 footer{margin-top:24px;color:#5a6472;font-size:12px}
 footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="hub">
  <div class="avatar">
    <!-- Quando o André mandar a foto, guardo-a como prime.jpg e troco este placeholder por <img src="prime.jpg" alt="Prime"> -->
    <span class="ph">👑</span>
  </div>
  <h1>Bem-vindos à coleção do Prime</h1>
  <div class="sub">Magic: the Gathering — decks, metagame e coleção</div>
  <nav class="tabs">
    <a href="meusdecks.html"><span class="ic">🎴</span>Os meus decks</a>
    <a href="metagame.html"><span class="ic">🌐</span>Metagame</a>
    <a href="buildability.html"><span class="ic">🔨</span>Montar</a>
    <a href="colecao_cor.html"><span class="ic">🎨</span>Coleção</a>
  </nav>
  <div class="subnav">
    <a href="alertas.html">🔔 Alertas de preço</a>
    <a href="colecao.html">🖼️ Galeria</a>
    <a href="coredecks.html">⭐ Core Decks</a>
  </div>
  <footer><a href="https://github.com/Baverone/mtgvault">repositório</a> · atualiza sozinho todos os dias</footer>
</div>
</body>
</html>
